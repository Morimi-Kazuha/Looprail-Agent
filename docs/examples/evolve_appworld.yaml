# Looprail Controlled Self-Evolution example for the AppWorld benchmark.
#
# The Evolver is opt-in. Candidate promotion records evidence and a commit
# identity, but never activates a candidate automatically; activation requires
# human review.
#
# Validate or run the example with:
#   uv run --frozen looprail evolve check --config <this-file>
#   uv run --frozen looprail evolve run --config <this-file> --smoke
#   uv run --frozen looprail evolve status --config <this-file>
#
# Replace every placeholder below with a path or value from your environment.

bench: appworld
repo_root: <repo-root>
# base_sha: <commit-sha>             # Optional root commit; otherwise the
                                     # current HEAD is fixed when the run starts.
work_dir: <evolution-workspace>      # Writable and outside repo_root.

# If models is omitted, the Evolver uses the model configured for Looprail.
# These roles guide the evolution loop; the target agent configuration remains
# fixed in bench_config.config_path.
models:
  driver:  {provider: claude_cli, model: <driver-model>, max_concurrency: 4}
  design:  {provider: claude_cli, model: <design-model>}
  verdict: {provider: claude_cli, model: <verdict-model>}
  # An OpenAI-compatible role can be configured as follows:
  # driver: {provider: openai_compat, base_url: https://provider.example/v1,
  #          model: <model-name>, api_key_env: EVOLVER_DRIVER_API_KEY}

funnel:                         # Optional compact-run settings.
  k_screen: 1
  k_confirm: 3
  budget:      {max_why_per_round: 2, candidates_per_why: 2}
  termination: {patience: 5, max_rounds: 8}

bench_config:
  # Copy docs/examples/subject_runtime.json and fill in its endpoint/model.
  config_path: <subject-runtime-config>
  appworld_data_root: <appworld-data-root>  # Persistent directory containing data/.
  train_task_file: <train-task-file>
  test_task_file: <test-task-file>          # Sealed test and retained tasks.
  n: 90
  conc: 8
  base_port: 8600
  extra_args: ["--task-timeout", "400"]
  # If whitelist is omitted, the repository defaults are used. The prefixes are
  # verified against base_sha when the run starts; invalid prefixes are rejected.

# --smoke applies a small overlay: one WHY, one candidate, one round, and K=1.
# The smoke work_dir receives an _smoke suffix.
smoke:
  bench_config:
    train_task_ids: ["<failing-task-1>", "<failing-task-2>", "<failing-task-3>"]
    n: 3
    conc: 3
    base_port: 8700
